science_case:
  novelty_claim: 待验证的核心创新是 proposal-conditioned cyclic visual marginalization 将候选旋转视觉观测、联合类别与完整框似然、同源角度风险真正接入
    OBB detector，而不是仅重写角度或检测分数。
  strongest_prior_difference: 相比旋转不变特征、Rotated RoIAlign、分布式框回归和常规不确定性排序，拟议机制的可区分点是同一
    proposal 的多候选视觉观测经共享 posterior 在类别、四个非角度框分量和轴向角度上联合边缘化；当前尚无跨数据集正证据。
  top_venue_relevance: 若联合边缘化可被功能反事实证实并在后续 G2、跨数据集和跨 detector 门控中稳定改善高 IoU 定位与选择性角度风险，才可能形成
    TGRS 或 ISPRS JPRS 所需的遥感方法与可靠性贡献。
  decisive_question: 修正全局 q-shuffle 与物理旋转坐标变换后，CMR 是否在冻结的 1024 个 DOTA train proposal
    上真实消费 proposal-specific posterior，并满足完整 G1 功能合取？
  minimum_discriminating_experiment: 对 legacy r052 同一冻结 1024 UID 宇宙执行零固定点的全局跨 proposal
    q 置换，重算逐 proposal loss、class likelihood 和四个非 theta box posterior；同时用角点仿射与逆变换的解析控制复核物理旋转等变性，并持久化全部逐行证据。
  decision_change_condition: 只有全局置换映射无固定点、解析几何控制通过且全部冻结 G1 门槛通过，才允许另行签发 G2；有效复核后任一功能门失败则关闭
    CMR，几何验证器自身失败则保持不裁决并仅修复验证器。
  premise_check:
    problem_found: true
    explanation: legacy r052 把 q 的 roll 放在逐 image group 内，单 proposal 组会得到恒等置换；同时被引用的
      raw summary 未进入 Git，因此原 KILL 结论和完成状态都不能作为已验证科学证据。
  epistemic_status:
    confirmed_facts:
    - statement: legacy r052 动态脚本在逐 image group 内对 q logits 执行 roll(1,0)。
      evidence_ref: experiments/r052_cmr_admission/run_dynamic_g1.py
      verified_at: '2026-08-28'
    - statement: legacy r052 审计报告记录 geometry theta 中位误差 0.531568、shuffle class change
        0.0，且未启动 G2。
      evidence_ref: audit_bundles/r052/G1_DYNAMIC_EXECUTION_AUDIT.md
      verified_at: '2026-08-28'
    - statement: 迁移后的项目证据索引明确写明当前没有已验证科研证据。
      evidence_ref: research/EVIDENCE.md
      verified_at: '2026-08-28'
    reasonable_inferences:
    - 逐图 roll 的退化足以污染 shuffle 两个失败项，但不能自动解释 geometry theta 失败。
    - 真实全局置换后若 class 和 box 仍不变化，则更支持 posterior 未被有效消费或已塌缩。
    personal_judgments:
    - 先纠正 G1 证据链比直接进入 G2 更有信息量，也避免把实现伪失败或伪通过带入高成本训练。
    - 当前工程进展尚不足以把项目从 JSTARS 对标水平上调到 TGRS。
    currently_unverifiable:
    - legacy r052 服务器上未跟踪的 raw rows、summary、parameter delta 与 mutation 文件内容是否和审计摘要完全一致。
    - 修正坐标变换后 geometry theta 失败是否仍然存在。
