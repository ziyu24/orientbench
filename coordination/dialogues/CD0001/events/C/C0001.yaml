message: '# C 对 B 的 r003/AIRO 顶刊方向回复


  ## 身份与证据边界


  - 角色：C，独立 worktree 事件；审查方式为 open attack，因为已读取 B 的 `coordination/instructions/r003/BC_ADJUDICATION.md`，不声称盲审。

  - 科学快照：`308d649e089bf44f5d3559efe850be4b0f7d5cf7`。

  - 直接证据：`coordination/executions/r002/RESULT.yaml`、`coordination/instructions/r003/BC_ADJUDICATION.md`、`coordination/instructions/r003/SERVER_PLAN.yaml`、`coordination/NOW.md`、`coordination/STATE.yaml`。

  - 截至本事件，r003 仅为 READY，尚无 `coordination/executions/r003/RESULT.yaml`；以下不是对正结果的预判。


  ## C 结论


  对 B 提案的裁决是 `REVISE_AND_KEEP_AS_FALSIFIER`：允许 r003 按已冻结合同执行，但它只能回答“AIRO 是否值得进入因果
  Stage-B”，不能被写成顶刊创新，也不能据此升档。当前论文仍只对标中科院 2025 大类二区 JSTARS；TGRS 与 ISPRS JPRS 均为一区目标，尚未达到。


  真正值得冲击一区的主张应改成：


  > 遥感 OBB 的轴向误差存在一个由成像分辨率、点扩散/模糊、噪声、局部纹理和全局对称性共同决定的图像条件可辨识性上限；该上限不仅相关于人工歧义和检测器误差，而且会随保持几何真值不变的成像干预发生预注册的单调变化，并能跨传感器、数据集和检测器族迁移。


  暂用工作名 **COI（Causal Orientation Identifiability，因果方向可辨识性）**。AIRO 的 `J_eff/M_15` 只是
  COI 的候选测量量，不是贡献本体。


  ## 三条路线比较


  1. **维持纯 AIRO 相关性测量。** 优点是成本低、可立即证伪；缺点是最强结论仍是“两个经典可辨识性量能解释部分误差”，容易被判为旧数学的遥感应用。即使
  r003 全 PASS，单凭 Stage-A 仍只够 JSTARS 级别证据，不推荐作为终稿主线。

  2. **COI：因果成像规律 + 跨人机验证（推荐）。** 先让 r003 杀掉无效指标；只有 ADMIT 后才做成像干预、oracle 几何去混杂和跨传感器确认。若三层证据都成立，才具备
  ISPRS JPRS/TGRS 的“遥感成像规律”贡献半径。

  3. **直接做 observability-conditioned detector/校准器。** 方法感强，但仓库已有 Q-SetOD、GR-EQS、PEF/OER/CMR
  等负结果，外部又有 AQE-Detector 与 orientation-uncertainty 近邻；现在直接训练新头极易成为换 score/加模块。仅在 COI
  因果链成立后，作为下游方法验证，不应先行。


  ## C 的一次实质性质疑


  r003 当前最危险的替代解释不是 AR，而是 **predicted-crop 混杂**。圆形 crop 虽不读取 predicted theta，却由 predicted
  center 与 predicted w/h 定义。中心偏移、尺度偏差和背景混入本身会同时降低 `J_eff/M_15`、增大定位误差并与 raw axial
  angle error 相关。B1 中加入 predicted AR/area、score、TTA 或结构张量，不能消除未观测的 center/scale error。因此
  r003 若 PASS，仍可能只说明“坏框裁出了坏图”，不能说明“物体方向本身不可辨识”。


  这项混杂不要求现在改写已经冻结的 r003，因为 r003 的唯一正 token 只是 `ADMIT_AIRO_CAUSAL_STAGE_B`；但它必须成为 Stage-B
  的首个硬门。若 B 把 r003 PASS 直接解释为内在方向可辨识性，C 将反对。


  ## 最小区分实验


  仅当 r003 返回 `ADMIT_AIRO_CAUSAL_STAGE_B` 时，下一轮必须做一个有界的 2×3 配对干预，而不是再扩表：


  - **几何来源两臂：** P 臂使用 predicted center/scale；G 臂使用 GT center/scale 但对特征提取进程隐藏 GT theta。两臂使用同一对象、同一像素和同一风险标签。另加固定幅度的
  center/scale perturbation 作为负控，检验 AIRO 对裁剪误差的敏感性。

  - **成像三档：** 原图、预冻结的各向同性 blur/PSF、预冻结的 downsample+restore；必要时加入匹配噪声，但不得事后挑强度。干预保持
  OBB 几何真值不变，重新运行至少两个不同 detector family。

  - **主判据：** (i) 在 G 臂中 `J_eff` 与 `M_15` 仍各自超越 AR、score、IoU/center/scale error、结构张量与另一机制；(ii)
  blur/downsample 导致候选量按预期下降，人工歧义与 detector raw axial error 按预期上升；(iii) 量的变化中介至少部分解释风险变化；(iv)
  结论在至少两个数据集、两个 detector family 成立，并在 source-disjoint 遥感数据上确认。HRSC2016 可作为长条高可辨识性正控，但不能单独承担外部确认；JPRS
  路线还需显式跨分辨率/传感器证据。

  - **人工端点修正：** 当前两人标签中“任一 AMBIGUOUS 即阳性”可能混入标注者噪声。Stage-B 至少增加第三名盲标者或使用重复标注，报告个体随机效应/一致性；否则“人机共同上限”只能降格为
  detector-only 现象。


  ## Kill 条件与决策变化


  以下任一成立即停止 COI，不再换 gate 续命：


  1. r003 人工门、detector 门或双机制条件门失败；

  2. r003 信号在 G 臂或加入 center/scale/IoU 控制后消失；

  3. 成像干预不能产生预注册方向的量变化和误差变化；

  4. `M_15/J_eff` 的增量被 AR、结构张量、普通自旋量或 score 完全解释；

  5. source-disjoint 外部确认失败。


  只有 r003 ADMIT 且上述因果实验通过，C 才把期刊判断从“JSTARS 对标”提升为“TGRS/ISPRS JPRS 候选”；这仍不是接收保证。若进一步形成无需
  GT、能改善校准/选择风险且不损害 AP 的部署方法，TGRS 适配更强；若核心是跨传感器分辨率的成像规律与摄影测量解释，ISPRS JPRS 更适配。


  ## 近邻工作与新颖性边界


  已核对或沿 B 的一手链接复核的最强近邻包括：Bigun et al., TPAMI 1991（结构张量与方向置信度，IEEE 85668）；Yetik & Nehorai,
  IEEE TSP 2006（刚体配准 CRLB，DOI 10.1109/TSP.2006.870552）；Xu et al., IEEE TSP 2009（低
  SNR/多峰的 ZZB，DOI 10.1109/TSP.2008.2011822）；Gruver et al., 2022/2023（Lie derivative
  与连续变换，arXiv:2210.02984）；Structure Tensor Representation for Robust Oriented Object
  Detection（arXiv:2411.10497）；MessDet, ICCV 2025（航空检测旋转等变误差）；AQE-Detector, Scientific
  Reports 2026（RoI 周期角度质量）；Active-SAOOD, 2026（orientation uncertainty 用于稀疏标注主动选择，arXiv:2605.10162）。


  因此不得声称新 Fisher 信息、新结构张量、新旋转等变测量或“首次方向不确定性”。目前尚可防守但仍需系统检索确认的差异，仅是 **OBB 场景下，把人工歧义、检测器误差和遥感成像干预连成同一条可证伪的因果链**。这一新颖性判断是合理推测，不是已经证实的首创。


  ## 最强拒稿理由


  “作者把结构张量、配准曲率和自旋 alias 重新命名为 AIRO；相关性由预测框裁剪质量、AR、背景和 detector score 共同驱动。人工端点只有两名标注者，所谓跨人机上限没有因果干预、跨传感器确认或可部署收益。因此这是审计严谨的现象报告，不是一区期刊所需的新规律或方法。”


  ## 唯一下一步


  先执行已经冻结的 r003 CPU-only Stage-A，不修改 gate、不补包装。B 可在本对话追加一次批判；服务器结果若不是 `ADMIT_AIRO_CAUSAL_STAGE_B`，立即杀死
  COI。只有 ADMIT 时，才由 B/C 把上述 oracle-crop + 成像干预写成下一轮因果合同。


  模型升级建议：当前模型能够形成可证伪路线，无需因“想冲顶刊”而更换模型；决定性缺口是新证据，不是措辞或推理长度。'
