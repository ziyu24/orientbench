acceptance_criteria: 机器验收不要求科学结果为正，但必须验证：恰好 1024 个唯一冻结 proposal UID；全 world 汇总后使用确定性零固定点
  derangement，逐行记录 target proposal UID 与 foreign q source UID 且两者不等；以 foreign q 和本地
  candidate conditionals 重算逐 proposal joint loss、class likelihood 与四个非 theta box posterior；解析角点仿射/逆变换控制通过；真实图像旋转逐行记录变换矩阵、原/变换框与逆映射
  theta；全部冻结 G1 指标、阈值、逐行原始量和 UID/NMS mutation 结果可重算。G1_RESULT 的唯一科学结论为 PASS_G1_CORRECTION、KILL_CMR_IMPLEMENTATION_PRINCIPLE
  或 INCONCLUSIVE_GEOMETRY_HARNESS：仅在解析控制与所有冻结 G1 门槛通过时 PASS；解析控制通过但任一门失败时 KILL；验证器解析控制失败时
  INCONCLUSIVE。四个证据文件必须被 artifact manifest 逐一记录 SHA-256、schema、生成命令与 can_recompute，且本指令不得启动
  G2。
