science_case:
  novelty_claim: 待验证的核心创新是 proposal-conditioned cyclic visual marginalization 将候选旋转视觉观测、联合类别与完整框似然、同源角度风险真正接入
    OBB detector，而不是仅重写角度或检测分数。
  strongest_prior_difference: 相比旋转不变特征、Rotated RoIAlign、分布式框回归和常规不确定性排序，拟议机制的可区分点是同一
    proposal 的多候选视觉观测经共享 posterior 在类别、四个非角度框分量和轴向角度上联合边缘化；当前尚无跨数据集正证据。
  top_venue_relevance: 若联合边缘化可被功能反事实证实并在后续 G2、跨数据集和跨 detector 门控中稳定改善高 IoU 定位与选择性角度风险，才可能形成
    TGRS 或 ISPRS JPRS 所需的遥感方法与可靠性贡献。
  decisive_question: 修正全局 q-shuffle 与物理旋转坐标变换后，CMR 是否在冻结的 1024 个 DOTA train proposal
    上真实消费 proposal-specific posterior，并满足完整 G1 功能合取？
  minimum_discriminating_experiment: 对 legacy r052 同一冻结 1024 UID 宇宙执行零固定点的全局跨 proposal
    q 置换，重算逐 proposal loss、class likelihood 和四个非 theta box posterior；同时用角点仿射与逆变换的解析控制复核物理旋转等变性，并持久化全部逐行证据。
  decision_change_condition: 只有全局置换映射无固定点、解析几何控制通过且全部冻结 G1 门槛通过，才允许另行签发 G2；有效复核后任一功能门失败则关闭
    CMR，几何验证器自身失败则保持不裁决并仅修复验证器。
  premise_check:
    problem_found: true
    explanation: legacy r052 把 q 的 roll 放在逐 image group 内，单 proposal 组会得到恒等置换；同时被引用的
      raw summary 未进入 Git，因此原 KILL 结论和完成状态都不能作为已验证科学证据。
  epistemic_status:
    confirmed_facts:
    - statement: legacy r052 动态脚本在逐 image group 内对 q logits 执行 roll(1,0)。
      evidence_ref: experiments/r052_cmr_admission/run_dynamic_g1.py
      verified_at: '2026-08-28'
    - statement: legacy r052 审计报告记录 geometry theta 中位误差 0.531568、shuffle class change
        0.0，且未启动 G2。
      evidence_ref: audit_bundles/r052/G1_DYNAMIC_EXECUTION_AUDIT.md
      verified_at: '2026-08-28'
    - statement: 迁移后的项目证据索引明确写明当前没有已验证科研证据。
      evidence_ref: research/EVIDENCE.md
      verified_at: '2026-08-28'
    reasonable_inferences:
    - 逐图 roll 的退化足以污染 shuffle 两个失败项，但不能自动解释 geometry theta 失败。
    - 真实全局置换后若 class 和 box 仍不变化，则更支持 posterior 未被有效消费或已塌缩。
    personal_judgments:
    - 先纠正 G1 证据链比直接进入 G2 更有信息量，也避免把实现伪失败或伪通过带入高成本训练。
    - 当前工程进展尚不足以把项目从 JSTARS 对标水平上调到 TGRS。
    currently_unverifiable:
    - legacy r052 服务器上未跟踪的 raw rows、summary、parameter delta 与 mutation 文件内容是否和审计摘要完全一致。
    - 修正坐标变换后 geometry theta 失败是否仍然存在。
  cas_2025_venue_assessment:
    system: CHINESE_ACADEMY_OF_SCIENCES_JOURNAL_PARTITION
    reference_journal: IEEE Journal of Selected Topics in Applied Earth Observations
      and Remote Sensing
    minimum_benchmark: TGRS
    conclusion: 当前只有未被新治理验证的单数据集功能审计与工程实现，尚无有效 G1、经验增益、跨数据集或跨 detector 证据，真实水平按地球科学大类二区
      JSTARS 对标；距离一区 TGRS 至少缺有效 G1、G2 正结果与外部泛化。
    preferred_benchmark: ISPRS JPRS
    benchmark_zone_label: 二区
    benchmark_zone: 2
    edition: 2025_FINAL
    reference_journal_short_name: JSTARS
    partition_basis: MAJOR_CATEGORY
    partition_category: EARTH_SCIENCES
    partition_source_url: https://www.ablesci.com/journal/detail?id=5NQk7p
    scope_source_url: https://www.grss-ieee.org/publications/journal-of-selected-topics-in-applied-earth-observations-and-remote-sensing/
    verified_at: '2026-08-22'
    project_level: CURRENT_LEVEL_ONLY
  comparable_papers:
  - title: Arbitrarily Oriented Object Detection in Remote Sensing Images Based on
      Improved YOLOv4-CSP
    venue: JSTARS
    year: 2022
    doi_or_url: https://doi.org/10.1109/JSTARS.2022.3214541
    verified_at: '2026-08-28'
    comparison: 该文代表应用导向的遥感旋转检测改进；本项目目前尚未拿出比其更完整的经验结果，但拟议 reliability 与联合边缘化问题具有潜在更深贡献。
  - title: Oriented Object Detection for Remote Sensing Images via Object-Wise Rotation-Invariant
      Semantic Representation
    venue: TGRS
    year: 2024
    doi_or_url: https://doi.org/10.1109/TGRS.2024.3402825
    verified_at: '2026-08-28'
    comparison: 该文以对象级旋转不变语义表征提供一区方法对标；CMR 必须证明联合 detector-native likelihood、可靠性收益与跨域泛化，而不能只是另一种旋转特征聚合。
  strongest_rejection_case: 即使代码功能正确，CMR 仍可能只是多角度 Rotated RoI 特征、有限群 pooling、mixture
    inference 与 uncertainty score 的工程组合；若没有 G2 的联合定位与风险增益及跨域结果，TGRS 审稿人可直接以创新不足和证据单薄拒稿。
  model_escalation_recommendation:
    recommend_higher_model: false
    reason: 当前任务是边界清楚的验证纠错与证据冻结，不需要更高模型重新发明科学路线。
    expected_benefit: 维持当前模型可避免额外 token 成本，并足以严格冻结全局置换与几何验证口径。
    token_cost: LOW
execution_summary: 修正全局q置换与几何验证，重跑冻结G1
objective: 在 legacy r052 冻结的 DOTA-v1.0 train 1024 个 pre-NMS positive proposal UID
  宇宙上，修复跨 proposal q-shuffle 和物理旋转几何验证器，重跑完整动态 G1，形成可提交、可复核的逐 proposal 原始证据，并只裁决是否具备另行进入
  G2 的资格。
