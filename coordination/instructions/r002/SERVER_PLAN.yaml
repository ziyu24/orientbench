  strongest_rejection_case: >-
    即使审计后程序正确，GR-EQS 仍可能只是已有 equivariance score、几何特征和正则化融合的工程组合；现有汇总显示 DIOR-R 单元方向混合且 FAIR1M/SODA-A 融合 AP 下降，若无稳健正向 G1/G2 与外部泛化，TGRS 审稿人可直接以创新不足、性能负收益和证据不可复现拒稿。
