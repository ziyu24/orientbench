    - 该项目仍只达到中科院 2025 地球科学大类二区 JSTARS 对标，尚无 TGRS 级可靠性方法证据。
    currently_unverifiable:
    - manifest 所列内部 code、sealed scores、risk rows 与 180000 bootstrap 是否真实存在且与列出的 SHA-256 一致。
    - r002 的 pred/GT angle 实际单位、long-side canonicalization、le90、GT AR、delta_0.75、matching 和 risk scaling 的逐行值。
