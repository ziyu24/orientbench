acceptance_criteria: >-
  机器验收不要求科学结果为正，但必须满足以下合取。第一，发布 r002 实际生成与验证代码，至少覆盖 evidence_manifest 中 code/rebuild_tta.py、build_features.py、attach_labels.py、ap_parity.py、gr_eqs_g1.py、fusion_ap.py、finalize_g1.py、verify_g1.py；逐项核对原 bytes/SHA-256。不得向 Git 写入本地绝对路径、账号、token 或机器身份；若原代码含本地路径，只允许字面量路径规范化，并提交逐项变换表、原 SHA-256、规范化 SHA-256，除此之外不得修改。第二，对 A-F 冻结 r014 row-key、ordered row sequence、cluster membership、score ties 和 90% prefix，提交 universe_identity；A-C 必须解释同行数同 clusters 是否逐 key 相同，D-F 必须列出全部 missing/extra/reassigned keys，禁止只比较 count。第三，提交可独立复算的 risk_rows，逐行至少含 unit、row_key、cluster、match identity、pred/GT raw angle、各自单位、canonical long/short/theta、le90 error degrees、GT AR、delta_0.75 degrees、floor、cap、unscaled risk、standalone score；用合成边界例验证 radian/degree、w/h+90°、0/90°、长边交换、le90 和 cap=3。第四，在完全相同 r014 universe 与同一 standalone score 上运行 r014-code/r002-code × r014-data/r002-data 四格；r014-code 必须动态调用 p3_selector/deployable_proxy_r014/scripts/evaluate_eqs_r014.py 的生产路径，r002-code 必须调用公开的实际代码，不得在 validator 中复制公式自证。四格逐 unit 报告 risk distribution、AUGRC、Risk@70、Risk@90、NRC、coverage、tie 行为及逐行差异归因；r014/r014 cell 须在 1e-10 内复现 r014，r002/r002 cell 须说明能否复现 8c645b3 摘要。第五，提交全部 18 个 unit/seed 的 compact scores 和恰好 180000 个 synchronized cluster-bootstrap replicates；独立验证器从 risk_rows 和 scores 重算所有指标、CI、reverse tests 与 gate，不能只返回 ok/count/errors。第六，若确认 r002 bug，必须只用现有预测和已冻结模型输出在 CPU 上重算完整 G1，保留原结果并另存 corrected_g1_unit_metrics 与 corrected decision；若无 bug，必须以逐行和四格证据解释十倍漂移后才可给出 R002_NO_BUG_KILL_REVALIDATED。若代码/资产缺失、哈希不符、row-key 无法对齐或四格不能闭合，结论只能是 INCONCLUSIVE_R002_EVIDENCE_UNAVAILABLE、INCONCLUSIVE_R002_UNIVERSE_MISMATCH 或 INCONCLUSIVE_R002_RISK_SEMANTICS。无论结果为何均不得启动 G2。
