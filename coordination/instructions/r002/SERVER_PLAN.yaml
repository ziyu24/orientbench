science_case:
  novelty_claim: >-
    GR-EQS 只有在冻结的跨数据集 universe、连续方向风险定义和选择性指标上可独立复算，且在不损害检测 AP 的前提下稳定改善可靠性，才可能构成 TGRS 或更高水平的方法贡献；当前 r002 的 KILL 结论尚不具备这一科学完整性前提。
  strongest_prior_difference: >-
    相比 r014 的 standalone equivariance 与 EQS，GR-EQS 声称通过几何可靠性建模改善跨数据集选择性方向风险；本轮不评价方法新颖性，只区分观察到的负结果究竟来自方法本身，还是角度单位、长边 canonicalization、le90、delta_0.75、匹配、universe 或 risk scaling 漂移。
  top_venue_relevance: >-
    TGRS/ISPRS JPRS 级结论必须建立在可审计、可独立复算且跨数据集口径一致的风险与 AP 证据上；哈希清单不能替代实际生成代码、逐行风险、sealed scores 和 bootstrap。
  decisive_question: >-
    在完全相同的 r014 A-F row-key 与 cluster universe 上，r014-code/r002-code × r014-data/r002-data 四格交叉复算能否解释 r002 与 r014 的 Risk@90 十倍级漂移，并使 r002 G1 可由 Git 内证据独立复算？
  minimum_discriminating_experiment: >-
    只使用现有预测和 CPU，公开实际生成与独立验证代码及可独立复算的 compact scores、risk rows 和 180000 个 synchronized cluster-bootstrap replicates；逐行审计 pred/GT angle 单位、长短边 canonicalization、le90、GT AR、delta_0.75 与 risk，并完成四格交叉复算。
  decision_change_condition: >-
    若任一口径或实现 bug 被确认，只允许用现有预测在 CPU 上按冻结 r014 语义重算完整 G1，再由 B/C 重新裁决；若无 bug，只有在四格、逐行证据、bootstrap 与原摘要全部可复核一致后才可重新接受 KILL。任何情况下本轮都不得进入 G2。
  premise_check:
    problem_found: true
    explanation: >-
      远端 main 的 results/r002_gr_eqs_method_admission 仅含汇总与 SHA-256 manifest，正式 r002 指令、实际生产/验证代码、sealed scores、risk rows 和 bootstrap 均未公开。DIOR-R/A 的 r014 与 r002 都报告 25080 行、3497 clusters，但 standalone Risk@90 分别为 0.1384735195 与 1.5517958439；同一 [0,3] 风险向量在 90% 精确前缀下即使任意重排，均值差的理论上限为 0.3333333333，实际差 1.4133223243，不能由重排序单独解释。
  epistemic_status:
    confirmed_facts:
    - statement: >-
        权威远端 main 与本地 HEAD 均为 8c645b3ddae16dc1fc34626c8a8997364fdf11eb，提交含 r002 汇总结果但不含 coordination/instructions/r002。
      evidence_ref: results/r002_gr_eqs_method_admission/README.md
      verified_at: '2026-08-31'
    - statement: >-
        r002 evidence_manifest 列出 157 项内部产物，包括 gr_eqs_g1.py、verify_g1.py、sealed scores 和 bootstrap_replicates.parquet，但 Git 中只提交 manifest 与汇总，independent_verification.json 仅有 ok、18 rows、180000 bootstrap rows 和空 errors。
      evidence_ref: results/r002_gr_eqs_method_admission/evidence_manifest.json
      verified_at: '2026-08-31'
    - statement: >-
        r014 production risk 为 min(le90(pred,GT)/max(delta_0.75(GT_AR),1 degree),3)，其 DIOR-R/A standalone Risk@90 为 0.13847351953158732；r002 同行数同 clusters 的值为 1.551795843850841。
      evidence_ref: p3_selector/deployable_proxy_r014/reports/unit_results_r014.csv
      verified_at: '2026-08-31'
    - statement: >-
        r002 相对 r014 的 audit row/cluster 还存在 D:+67/+9、E:-239/+2、F:-261/+2 的 universe 差异。
      evidence_ref: results/r002_gr_eqs_method_admission/g1_unit_metrics.csv
      verified_at: '2026-08-31'
    reasonable_inferences:
    - r002 至少在 risk rows、角度语义、匹配/universe 或 scaling 中有一项与 r014 漂移；当前摘要不足以定位责任属于 code 还是 data。
    - FAIR1M/SODA-A 的融合 AP 下降可能最终仍足以触发负门，但不能替代对风险主端点的正确复算，也不能治愈证据链缺失。
    personal_judgments:
