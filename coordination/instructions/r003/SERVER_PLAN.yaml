acceptance_criteria: >-
  验收是以下有序合取。G0 权威资产：M4 输入只允许 top_journal_v3_reaudit_055/annotation_tools/m4_angle_annotation/internal/m600_sampling_manifest.csv（434430 bytes；SHA-256 c61958d06864d223864a83beb31a27345f3aa313c6831f22cbdd9b654c6a5f91）与 reports/m4_m600_pairs.csv（165807 bytes；SHA-256 ec84b343c8e1adb226263a4377cece06f7ba3c75fa407cdb340a4c92e8202618）；明确禁止把 top_journal_v3_reaudit_055/reports 下的 1500-row PENDING 文件当作正式标签。600 个 anon_id 和 600 个 source_record(path,line) 必须各自唯一并与 pairs 600/600 连接；source_image_sha256 必须 600/600 非空且命中，但只应按 (dataset,image_id) 聚合为 585 个 logical images（DIOR-R=197、FAIR1M=188、SODA-A=200），同组 path/SHA 必须一致，不得错误要求 600 个图像 SHA 唯一。source image 允许在登记 dataset root 内按同 SHA 解析搬迁路径。历史 crop 只允许从仓库根 annotation_tools/m4_angle_annotation/crops 解析，crop 可缺；存在却 SHA 不符时隔离，并仅在 source image SHA 命中后按冻结 bounds 内存重建。人类强基线还要求 A/D/E 对应 geometry source records 与 feature assets 可按 200/200/200 键连接。

  G0 detector universe：唯一总体是 audit_bundles/r036/inputs/qsetod_rows.parquet（34796105 bytes；SHA-256 bb4184089a0cb9e0584cdf9fe340fe76a5d831090f07a6bc0c73e4499ac8da51）的 A--F 515559 个 matched keys，固定计数 A=43848、B=47887、C=47881、D=26108、E=157586、F=192249；不得改成 full M069、按可读图过滤或补抽。只读核对 audit_bundles/r036/inputs/source_inventory.csv 所列 A--F 12 个 features/matched_geometry 资产的 bytes/SHA/schema，并验证 features--geometry key 唯一覆盖、score/class 及 OBB 派生 AR/area 数值一致。geometry 必须提供 image locator 与完整 pred/GT OBB，features 必须提供所有已登记 TTA 字段。先从完整冻结 key universe 选样，之后任一选中图缺失都禁止 backfill。对选中图生成本轮 logical image ID/bytes/SHA seal；A/B/C 与 E/F 的同 logical image 当前 SHA 必须跨 unit 一致，M4 重叠的 A/D/E 图必须命中历史 M4 SHA，其余图明确标注 historical_pixel_identity_unsealed，不得包装成 confirmatory provenance。必要 M4 像素或其锚不齐时输出 INCONCLUSIVE_AIRO_ASSET_UNAVAILABLE；人工门通过后任一必要 A--F asset、selected image 或锚不齐时输出 INCONCLUSIVE_AIRO_DETECTOR_ASSET_UNAVAILABLE。任一早停都必须生成 expected_results 中全部路径的 schema-valid NOT_RUN 占位、明确 stop_stage/reason，并纳入 manifest；资产失败不得进入任何 KILL、下载、换图、训练或推理。

  G1 信息墙：受信 resolver 只能按字段 allowlist 从混合记录生成 feature-sealed controls/sanitized_prediction_view，允许 key、unit、dataset、logical image locator、qset 冻结 cluster/mother_scene_id、pred center/w/h、score、qset 已有 normalized class_name 与登记 TTA，严禁 GT OBB、gt_id、GT AR/area、IoU、angle_error、risk 和 human outcome；DIOR/FAIR cluster=image_id，SODA 必须使用 qset 已存 mother cluster，不得退化为 tile。human view 也须封存 dataset/image_id 对应 mother ID。随后封存 sample_key_manifest、config_role_key_manifest、split_assignments 与 prediction/image SHA。feature extractor 不得打开 raw JSONL、qset mixed table、M4 manifest 或 labels，只能读 sanitized view 和 sealed pixels；label splitter 是独立受信进程，按每个 (analysis_family,config,fold) 生成只含 fit keys 的 source_label_views 与另行封存的 target_outcome_views。每个 evaluator 只获其 source-label allowlist，必须 anti-join target keys、写 fit-key guard 并 seal target prediction；只有对应 seal 存在后 evaluator 才能获得该 config/fold 的 target outcome。全局 mixed labels 即使物理存在也不得进入 feature/model 进程，validator 必须用 label-access mutation 验证拒绝。

  G1 抽样与 config roles：第一层 outcome-blind base sample 对每个 unit 独立完成，stratum 固定为 qset class_name × unit-internal log_pred_ar quintile × unit-internal log_area quintile；quantile=linear，重复边界合并，cell 字符串按 UTF-8 lexicographic 排序。unit 配额为 min(8000,unit rows)，按 cell 行数 largest-remainder 分配，相同 remainder 按 cell 字符串升序；cell 内按 SHA256(UTF-8 "r003|20260901|unit|image_id|pred_id") 原始 digest、再按 row_id 升序遍历，每 mother 最多 20 行。cap 使 cell 不足时接受短额，禁止跨 cell 重分配；frozen base 后图像/join 失败不得替换。第二层对每个 (config,role,unit) 明确冻结 base-key 子集：source pool 的 log_pred_ar/log_area 以 source units 等总权重、linear quintile 定边，target 按同边界赋值；common-support cell=qset class_name × source AR bin × source size bin，要求 pooled source 与 target 各>=50 rows 且各>=10 mother clusters。BC/ABC source manifest 分别列出 B,C 或 A,B,C 的 unit 子表，训练只用这些 keys；target 未见 fine class 为全零 one-hot，未见 class_name 不进入 support。不得为不同 config 重抽或补样。发布每个 config-role-unit 的 included/excluded keys、shortfall、边界、理由和 inclusion rate；row base weight 恒为 1，无 inverse-probability 权重；estimand 只能称 frozen matched/common-support audit sample，不能称全部 detections。

  G1 AIRO 唯一定义：标准 decoder 输出 RGB 后先转 float64/255，并以 Y=0.2126R+0.7152G+0.0722B 取灰度；crop 中心只用 predicted center，方向无关半径 R=max(48,0.90*max(pred_w,pred_h)) source pixels，绝不读取 predicted theta。原生正方 patch 边长 2*ceil(R)+1；边长大于 257 时生产实现固定 OpenCV INTER_AREA 到 257，否则保留原栅格，并记录 source-pixel coordinate map。生产 warp 固定以像素中心 (side-1)/2、inverse mapping、OpenCV INTER_LINEAR、constant invalid border 且单独 warp valid mask；生产梯度固定 float64 三点 central difference、边界二阶 one-sided，并按 coordinate map 缩放回 source-pixel。METHOD_FREEZE 必须记录 decoder/OpenCV/NumPy 版本；独立实现须用非 OpenCV cubic map-coordinate path。固定径向权重在 r/R<=0.70 为 1、0.70<r/R<0.85 作 cosine taper、r/R>=0.85 为 0；所有角度/nuisance 共用其 warp-valid-mask 交集与同一 W。真实图 sigma=max(1e-4,median(abs(I-median3x3(I)))/0.67448975)，median filter 固定 3x3 nearest-border，fixtures 使用注册的已知 sigma。空间梯度和坐标均映射回 source-pixel 单位，g_theta=(-y*dI/dx+x*dI/dy) 是每 radian rotation tangent；N=[dI/dx,dI/dy,x*dI/dx+y*dI/dy,I,1] 分别为 tx、ty、isotropic log-scale、gain、offset nuisance。以 W 加权、rcond=1e-10 的 Moore--Penrose 投影 P_N，J_eff=max(0,sum(W*(g_theta-P_N*g_theta)^2)/(sigma^2*sum(W)))；J_raw=sum(W*g_theta^2)/(sigma^2*sum(W))。

  G1 全局量：对 phi=0,...,179 degrees 的 1-degree grid，E(phi)=min sum(W*(I(x)-a*I(exp(s)R_phi*x+t)-b)^2)/(sigma^2*sum(W))；唯一 nuisance 为 t_x,t_y in {-1,0,1} source pixel、s in {-0.02,0,0.02}，a in [0.5,2]、b in [-0.25,0.25] 的 constrained least squares，禁止负 gain，所有候选复用上述 common-valid support。d_pi(alpha,beta)=min(abs(alpha-beta),180-abs(alpha-beta)) degrees，M_15=max(0,min_{d_pi(phi,0)>=15}E(phi)-E(0))。M_raw 使用同一 grid/W/sigma，但固定 t=s=b=0、a=1。每 dataset/unit 的 AIRO valid fraction 必须至少 0.90；无效行不得删除，J/M 由 source median 插补且 valid fraction/invalid indicator 已在 baseline，覆盖不足是 KILL_AIRO_SPECIFICITY。不得扫描候选矩形、输出 refined angle、融合 detection score 或修改预测。

  G1 fixtures：两套独立实现固定 tau=1e-4。constant 与 radial disk 的 J_eff/M_15 均 <=tau；非轴外对称的 ellipse 与 single-lobe texture 的 J_eff/M_15 均 >=10*tau；四重对称 square/checker 的 J_eff >=10*tau 而 M_15<=max(tau,0.1*ellipse M_15)，从而 M 恒为零不能通过。blur 与 2x area-downsample 必须复用同一已知 sigma、物理坐标和 common support，J_eff/M_15 均 <=0.90 原值。解析 J 与 eps=2-degree 中央差分满足 absdiff<=max(tau,0.05*max(abs(values)))，真实固定 audit 子集 Spearman>=0.99；rotate--inverse 的有效内区 NRMSE<=0.02，pi 周期 absdiff<=max(1e-8,1e-6*max(abs(values)))；全局旋转与允许 nuisance/正 gain 强度仿射满足 absdiff<=max(tau,0.05*max(abs(values)))。主设置之外只跑完整固定敏感性矩阵 eps={1,3} degrees、grid={0.5,2} degrees、radius coefficient={0.75,1.05}，不得择优。

  G2 人工端点与模型：以 pair_status 为唯一映射；任一标注者为 SKIP 则整行排除，余下 y_amb=1 当且仅当至少一位 AMBIGUOUS，y_amb=0 当且仅当两位均 LABELED。冻结计数必须为总 576=126 positive+450 negative；DIOR-R 188=66+122、FAIR1M 188=19+169、SODA-A 200=41+159；450 个双数值的 pi-periodic disagreement 仅为条件次结局。H1 只含 prelabel controls：source-defined class one-hot、pred AR/area、native pixel size/resample scale/valid fraction、detection_score、logit_score、support_fraction、missing_fraction、u_axis、iou_loss、center/width/height/score dispersion、association_margin、mean/total gradient、boundary contrast、sigma、普通 structure-tensor eigen-ratio、J_raw 与 M_raw；不得使用 target GT AR/area。H2=H1+log1p(J_eff)+log(M_15+epsilon)，H2J=H1+log1p(J_eff)，H2M=H1+log(M_15+epsilon)。epsilon=max(1e-12,0.01*source median positive M_15)；连续量 source median 插补并加 missing indicators，标准化/类别编码只 fit source。分类器固定 LogisticRegression(penalty=l2,C=1,solver=liblinear,max_iter=1000,tol=1e-8,random_state=20260901)，数值次模型固定 Ridge(alpha=1,solver=svd)，不调参。

  G2 人工统计：三次 leave-one-dataset-out 必须分别在隔离的 fold evaluator 中运行；每个 evaluator 只能收到两套 source labels 与全部 prelabel controls，必须 anti-join 并拒绝 held-out target outcome key，输出 label_access_audit 并封存 target predictions 后，独立 label-attach 才能读该 fold target outcomes。benefit 定义为 baseline log-loss 减 full log-loss；global benefit 为三个 held-out dataset benefit 的等权均值，AUROC delta 为 full 减 baseline。使用下述固定 human target-cluster bootstrap，H2-vs-H1 global benefit>=0.01、95% CI_low>0、global AUROC delta>=0.03，至少 2/3 dataset 点估计 benefit>0，且不存在 benefit CI_high<0 的 dataset。可观测性方向门要求三个 source-fitted H2 模型的 standardized log(M_15+epsilon) coefficient 全部<0。M 的条件门 H2-vs-H2J global log-loss benefit>=0.005、CI_low>0，并在三个 dataset 单侧 p 的固定 Holm-3 中至少两个 adjusted p<=0.05；H2M 只用于披露 J 的人工条件增量，不构成人工 PASS。450 个双数值样本的 y_num=min(abs(theta1-theta2) mod 180,180-(abs(theta1-theta2) mod 180)) degrees；固定 Ridge H1/H2/H2J/H2M 仅披露每 dataset 与 dataset-equal 的 MAE、MSE、Spearman 及同一 bootstrap CI，任何数值 disagreement 结果都不影响 token，因为该样本条件选择于非歧义。任一人工主门或方向门失败为 KILL_AIRO_HUMAN_GATE。

  G3 detector 标签、基线与迁移：固定六配置 HOdet_A_to_B、HOdet_A_to_C、HOdet_BC_to_A、HOdata_ABC_to_D、HOdata_ABC_to_E、HOdata_ABC_to_F，target detector family 固定 A=PSC、B=ORCNN、C=RTMDet、D=PSC、E=PSC、F=ORCNN。A/B/C 同一 DIOR 图像严禁跨 detector 像素泄漏：先将 canonical mother_id 编码为 UTF-8，mother fold=int.from_bytes(SHA256(UTF-8 "r003|dior-fold|"+mother_id).digest()[0:8],byteorder="little",signed=false) mod 5；每折只用 source detector 的其余四折拟合，并仅预测 target detector 的 held-out fold，B/C 共用 fold，三配置汇总 OOF。ABC-to-D/E/F 跨数据可用全 source；多 source unit 训练时每 unit 总 sample weight 相等。每个配置/fold evaluator 只能收到 config_role_key_manifest 中的 source labels，必须 anti-join target keys 并在 target-outcome attach 前 seal predictions/label_access_audit。B1 固定包含 G2 H1 的全部 prelabel controls；B2=B1+J_eff+M_15，B2J=B1+J_eff，B2M=B1+M_15。四模型均为 HistGradientBoostingRegressor(loss=squared_error,max_iter=200,max_leaf_nodes=15,learning_rate=0.05,early_stopping=False,random_state=20260901)，不调参；B1 所有 monotonic_cst=0，B2 对 J_eff/M_15 固定 -1、B2J 对 J_eff 固定 -1、B2M 对 M_15 固定 -1，其余变量全为 0，故更高可观测性不能预测更高风险。target prediction seal 后才从 frozen qset key 对应 geometry 独立挂接 outcomes：pred/GT 都在 w<h 时交换 w/h 且 theta+=pi/2，再 theta=theta mod pi；令 d=(theta_pred-theta_gt) mod pi，le90_deg=degrees(min(d,pi-d))，y=clip(le90_deg/90,0,1)。不得 rematch；与 qset stored angle_error 仅作 absdiff<=2e-5 audit，失败为 INCONCLUSIVE_AIRO_IMPLEMENTATION。禁止 delta_0.75、GT-AR normalization 和 r002 risk。

  G3 whole-tie 指标：预测风险越小越先保留；序列化 float64 以 IEEE 数值相等形成不可拆 tie group，NaN/inf 非法。对 target row weight w 与 y，按预测风险升序分组，gw=sum(w)、gr=sum(w*y)、T=sum(w)、curve_k=cumsum(gr)_k/T、prev_1=0 且 prev_k=curve_{k-1}，whole-tie generalized risk-mass AUGRC=sum_k((prev_k+curve_k)/2)*(gw_k/T)；常数预测单 tie 得 0.5*weighted_mean(y)，空组非法。Spearman 是以同一权重对 prediction 与 y 的 exact-tie weighted midranks 作 weighted Pearson correlation。unit full benefit=AUGRC(B1)-AUGRC(B2)，Spearman delta=rho(B2,y)-rho(B1,y)。不得拼接不同 unit 的风险分数重排；dataset benefit 是该 dataset 内 unit benefit 等权均值（DIOR 3、FAIR 1、SODA 2），global benefit 是三个 dataset benefit 等权均值。

  G3 bootstrap 与门：bootstrap registry key 固定为 (analysis_family,dataset)，analysis_family ordinal human=0、detector=1，dataset ordinal DIOR-R=0、FAIR1M=1、SODA-A=2，seed=20260901+100*family_ordinal+dataset_ordinal。human 的 K 是该 dataset 576-endpoint 子集中的 sorted UTF-8 unique mother IDs；detector 的 K 是该 dataset 所有 target config-role-unit keys 的 sorted UTF-8 mother-ID union，DIOR A/B/C 共用此 union，SODA E/F 共用此 union。每 replicate 严格执行 rng=PCG64(seed) 的 Generator，idx=rng.integers(0,K,size=K,endpoint=false)，registry 保存每 mother multiplicity；unit 不含某 mother 时贡献零，若某 unit 当次总权重 T=0 则该 replicate/unit 非法并使该 unit p=1/FAIL。所有 selected row base weight=1，replicate weight=mother multiplicity；全部 arms 同步用同一 multiplicity。每 replicate 只重权已 seal 的 target predictions/outcomes，不重拟合，CI 为 replicate distribution 的 linear 2.5%/97.5% quantile，并明确是 conditional-on-frozen-source-fit；weighted midranks 每 replicate 重算。单侧 raw p=(1+count(benefit_b<=0))/10001。

  G3 full 与机制门：B2-vs-B1 六 unit 固定 Holm-6，任何 unavailable p=1。unit full witness 要求 benefit>=max(0.005,0.05*AUGRC(B1))、CI_low>0、Holm-6 adjusted p<=0.05 且 Spearman delta>=0.02；至少 4/6 witnesses，覆盖三数据集和至少两个 target detector families，三个 dataset benefit 均>0，且不存在 benefit CI_high<0 的 unit。M 条件 benefit=AUGRC(B2J)-AUGRC(B2)，J 条件 benefit=AUGRC(B2M)-AUGRC(B2)；两种机制各自建立固定 Holm-6 unit family，unit conditional witness 要求 benefit>=max(0.002,0.02*对应 unit reference AUGRC)、CI_low>0、Holm-6 adjusted p<=0.05。每种机制的 witness units 必须覆盖至少两个 target detector families；同时各自先做 unit delta 再等权聚合到 dataset，并在独立固定 Holm-3 中至少两个 dataset 达到 benefit>=max(0.002,0.02*对应 dataset reference AUGRC)、CI_low>0、adjusted p<=0.05。任一机制的方向、family coverage 或 dataset 条件门失败均为 KILL_AIRO_ALIAS_NOT_DISTINCT。

  G4 specificity 与 mutations：在 pred_AR>=2.1 以及每 config 的 qset class_name × source-defined pred-AR quintile × pred-size quintile × boundary-contrast quintile common-support strata 中，B2-vs-B1 dataset benefit 必须三数据集均>0、至少三个 unit CI_low>0；contrast/source bins 均用 linear quantile、重复边界合并。完整 eps/grid/radius sensitivity matrix 中 dataset benefit 与 M/J 条件 benefit 不得翻号。permutation 只作用于 sealed target features，source fit 与 target outcomes 固定且绝不重拟合：joint 以 PCG64 seed=20260911 在上述 strata 内把 (J_eff,M_15) 二列作为配对向量排列，统计量为 global dataset-equal B2-vs-B1 benefit；J-only 以 seed=20260912 在上述 strata 再加 source-defined M_15 decile 内仅排列 J_eff，M 固定，统计量为 global B2-vs-B2M benefit；M-only 以 seed=20260913 在上述 strata 再加 source-defined J_eff decile 内仅排列 M_15，J 固定，统计量为 global B2-vs-B2J benefit。每次对各 config/target unit 的 strata 以 Generator.permutation 独立排列，少于2行的 strata 原样并报告；原始及 log-derived column 必须同步重算。三族各 1000 次，对应 observed global benefit 必须严格高于 np.quantile(permutation benefits,0.99,method="higher")，且 permutation mean<max(0.001,0.1*observed benefit)，否则 KILL_AIRO_SPECIFICITY。blank/radial mask、predicted-theta prealignment injection、label-before-feature-seal、risk-definition substitution、bootstrap cluster-to-instance substitution 和 decision-token mutation 必须被 validator 拒绝。

  独立证据：validator 必须从 raw images 对至少 128 个 human rows 和每 unit 至少 64 rows 独立重抽 patch，用与生产实现不同的 warp/finite-difference path 重算 J/M；J Spearman>=0.99、M Spearman>=0.98，并独立复核 pred/GT angle canonicalization。它须从 prelabel features 与 postseal labels 重拟合 H1/H2/H2J/H2M 和 B1/B2/B2J/B2M，按 seed 重建并逐项哈希 bootstrap registry，重算所有 10000 replicates、Holm families、specificity、mutations 与 token，不能只读 decision 或已存 delta。提交全部生成/验证代码、sanitized rows、pre/post-seal 表、split/sample manifests、全部 replicate deltas、logical ID/bytes/SHA、ordered-key hashes、结果和无遗漏 artifact manifest；Git 禁止绝对本地路径、账号、token、机器身份和受许可 pixels/crops。

  最终 token 按 stage 顺序且不可遮蔽地唯一决定：必要 M4 asset/mismatch -> INCONCLUSIVE_AIRO_ASSET_UNAVAILABLE；human 所需两实现、seal、复算或 mutation 不一致 -> INCONCLUSIVE_AIRO_IMPLEMENTATION；实现一致但注册 synthetic/coverage 性质失败 -> KILL_AIRO_SPECIFICITY；其后人工方向或主门失败 -> KILL_AIRO_HUMAN_GATE。只有 HUMAN PASS 后才检查 detector 必要 asset，缺失/mismatch -> INCONCLUSIVE_AIRO_DETECTOR_ASSET_UNAVAILABLE；detector 两实现、fit-key guard、复算或 mutation 不一致 -> INCONCLUSIVE_AIRO_IMPLEMENTATION；detector full 门失败 -> KILL_AIRO_DETECTOR_GATE；M 或 J 的方向、family coverage 或条件门失败 -> KILL_AIRO_ALIAS_NOT_DISTINCT；真实 specificity/permutation 失败 -> KILL_AIRO_SPECIFICITY；全部通过 -> ADMIT_AIRO_CAUSAL_STAGE_B。允许 token 仅为这八种。ADMIT 只允许 B/C 另开受控成像再推理计划，不授权本轮训练、推理、GPU、HRSC/RSAR、新数据、论文修改或期刊升档。
