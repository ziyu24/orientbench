science_case:
  novelty_claim: >-
    待检验假设是：对遥感 OBB，由预测中心和无方向尺度确定、且不按预测角预对齐的圆形外观 crop，在轴向商空间 RP1 上存在两种可区分的可观测性机制。全局 alias 间隙 M_15 应在局部有效旋转信息 J_eff 与经典基线之外预测盲人工方向歧义；J_eff 与 M_15 还应各自在另一机制及几何、检测分数、完整 TTA、普通结构张量和低级图像统计之外预测冻结 detector 的 raw axial angle error，并跨数据集和 detector family 迁移。本轮不声称发明 structure tensor、Fisher/CRLB、Ziv--Zakai bound、Lie derivative 或局部加全局配准界；唯一待检验的新颖性是 OBB 特有的人机共同、跨域测量命题。
  strongest_prior_difference: >-
    Bou et al. 2024 的 Structure Tensor Representation 从 OBB 的 w/h/theta 构造网络回归表示，不读取真实 crop 的图像梯度；AQE-Detector 从 detector RoI 学习周期角度方差并融入 NMS；MessDet/OER 测量变换后的 detector-output equivariance；GR-EQS 学习或融合预测特征作风险排序；CMR/PEF 扫描候选角并尝试修正 detector。AIRO 只在不使用 predicted theta 的圆形像素域测量 intrinsic appearance observability，不输出 refined angle、不融合 score、不改变框，也不调用 detector forward。
  top_venue_relevance: >-
    若人类盲双标、六个本轮像素已封存但历史像素身份局部未封存的 detector units、三数据集和多 detector family 同时支持同一局部/全局机制，且后续以全新确认性资产和受控成像干预证明信息变化先于角误差变化，该路线才可能形成 TGRS/JPRS 级 measurement-science 贡献。一次回顾性离线相关性或风险排序仍不足以提升当前 JSTARS 对标。
  decisive_question: >-
    在强几何、完整 TTA 和经典图像基线之上，M_15 是否在 local J 之外捕获盲人工全局方向歧义，且 J_eff 与 M_15 是否各自对 raw axial detector error 保留预注册的跨域条件增量，而非退化为 AR、size、structure tensor、普通自相关或插值伪影？
  minimum_discriminating_experiment: >-
    CPU-only 使用冻结 M4 600 双标目标和 r036 A--F 六单元的 515559 行 qset matched cohort；从原图和 raw prediction identity 独立裁出不按 theta 对齐的圆形 patch，先封存像素特征与跨域预测再挂接 GT/人工结局；完成合成 fixtures、DIOR 同图五折 OOF、leave-dataset 迁移、强基线、source-defined common support、mother-scene cluster bootstrap、真实 mutation 和独立重算。
  decision_change_condition: >-
    资产、实现、人工、detector、双机制条件增量与稳健性按固定优先级裁决；全部通过只授予 ADMIT_AIRO_CAUSAL_STAGE_B。必要像素或 A--F geometry/features 缺失只允许对应 INCONCLUSIVE_ASSET；两套实现或证据完整性不一致只允许 INCONCLUSIVE_IMPLEMENTATION；实现一致但注册合成性质、人工、detector、条件增量或真实 specificity 失败时必须分别 KILL，不得改名续命，也不得以关系场、解析 box risk 或旧 r002 rows 替代。
  premise_check:
    problem_found: true
    explanation: >-
      现有项目已杀死 Q-SetOD、OER、SAUR、AHC、P2C、CORA、PEF 与 CMR，并把 GR-EQS 负向冻结；简单 conformal set、TTA/score selector、候选角视觉场和邻域方向一致性均不是新路线。AIRO 的数学部件也有经典先验，因此必须把第一杀死条件设为“结构张量/AR/size 换皮”，而不能先假定创新成立。
