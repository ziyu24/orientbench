  - HARD_PERMISSION
  - HARD_RESOURCE
  - HARD_DATA
  - SECRET_BOUNDARY
  - DESTRUCTIVE_BOUNDARY
  post_execution_review:
    reviewers:
    - B
    - C
    ordinary_correctable_error:
      separate_issue_registration: FORBIDDEN
      user_notification: FORBIDDEN
      next_action: DIRECT_NEXT_R_INSTRUCTION_CORRECTION
      repeated_discussion: FORBIDDEN
      append_only_bc_review_receipt: REQUIRED
      prior_journal_and_evidence_digest_binding: REQUIRED
      same_instruction_recovery_before_bc_verdict: FORBIDDEN
      same_instruction_recovery_after_abnormal_terminal: FORBIDDEN
      review_receipt_consumption: EXACTLY_ONCE_BY_NEXT_R_CORRECTION
      review_receipt_consumption_transaction: PROJECT_PERSISTED_AND_IDEMPOTENT
      independent_worktree_review: REQUIRED
      correction_verification: B_OR_C_REQUIRED
    catastrophic_error:
      threshold: SCIENTIFIC_ROUTE_OR_RESULT_CHAIN_FUNDAMENTALLY_INVALID_OR_UNRECOVERABLE_EXTERNAL_DAMAGE
      user_notification: IMMEDIATE
      issue_registration: REQUIRED
      blocks_further_research_until_notice: true
    successful_completion:
      scientific_reviewer:
      - B
      - C
      - DOCTORAL_EXPLICIT
      server_scientific_rating: FORBIDDEN
      assessment_receipt: REQUIRED_BEFORE_NEXT_NEW_EXPERIMENT
      assessment_binds_verified_result_commit: true
      below_tgrs_next_action: CONTINUE_WITH_NEXT_R
      goal_reached_state: GOAL_REACHED_CANDIDATE_NOT_PUBLICATION_GUARANTEE
