<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M4 长边方向标注</title><link rel="stylesheet" href="/static/style.css"></head><body><header><strong>M4 OBB 几何长边方向</strong><span id="progress"></span><input id="annotator" placeholder="标注者 ID"></header><main><section class="workspace"><div class="viewer" id="viewer"><div class="canvas-wrap"><img id="image" alt="目标局部裁剪"><canvas id="overlay"></canvas></div></div><aside class="side-controls"><div class="angle">当前角度：<b id="angle">未标注</b></div><div class="nav-actions"><button id="next">下一个</button><button id="zoom">放大图片</button><button id="restore" disabled>还原图片</button><button id="prev">上一个</button></div><label class="state-option"><input type="checkbox" id="ambiguous"> 图片模糊或方向无法判断（ambiguous）</label><label class="state-option"><input type="checkbox" id="skip"> 图片损坏或目标不可见（skip）</label><div class="save-actions"><button id="save">保存</button><button id="export">导出 CSV + JSON</button></div><p id="status"></p></aside></section><section class="notes-panel"><label for="notes">备注（可选）</label><textarea id="notes" placeholder="仅在需要补充说明时填写"></textarea></section></main><script src="/static/app.js"></script></body></html>
