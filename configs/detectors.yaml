# orientbench — detectors.yaml (D2 9-detector taxonomy + availability)
# 可用性据实标注；不把 ARS-DETR 当 RHINO；不伪造 detector 可用性。
# baseline 来源解析见 outputs/bench_core/baseline_inventory.json (73 条, 67 valid)。

taxonomy:           # 9-detector archetypes (R6 D2 host = 9-detector taxonomy)
  - archetype: two_stage_regression
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [oriented_rcnn_r50]
    available: true
  - archetype: two_stage_regression_strong_backbone
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [oriented_rcnn_lsknet_s, strip_rcnn_s]
    available: true
  - archetype: one_stage_regression
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [rotated_retinanet_r50]
    available: true
  - archetype: one_stage_dense_realtime
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [rotated_rtmdet_s, rotated_rtmdet_m]
    available: true
  - archetype: angle_coder_psc
    head_type: angle_distribution_head
    default_score: negative_normalized_angle_entropy
    families: [rotated_retinanet_psc_r50]
    available: true
  - archetype: detr_angle_distribution
    head_type: angle_distribution_head
    default_score: negative_normalized_angle_entropy
    families: [arsdetr_r50]
    available: true
    note: ARS-DETR — NOT a RHINO substitute
  - archetype: rotated_detr_rhino
    head_type: angle_distribution_head
    default_score: negative_normalized_angle_entropy
    families: [rhino]
    available: false        # MISSING — C1/B host (R6); 不得用 ARS-DETR 替代
    note: RHINO-style rotated DETR missing in pth_data/readme.md
  - archetype: weakly_supervised
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [h2rbox_v2_r50, point2rbox_v2_r50]
    available: true
  - archetype: pseudo_label
    head_type: pure_regression_head
    default_score: calibrated_gv_obliquity_proxy
    families: [rotated_fcos_r50_pseudo]
    available: true

a4_host:
  name: hybrid_encoder_oriented_detr
  role: A4 source-attribution host (R3/R6)
  available: false
  status: frozen_snapshot_pending

default_score_definitions:        # FROZEN (项目执行文件 §7.2), 不得更改
  angle_distribution_head: negative_normalized_angle_entropy
  pure_regression_head: calibrated_gv_obliquity_proxy
  native_quality_head: native_plus_benchcore_default_comparison
