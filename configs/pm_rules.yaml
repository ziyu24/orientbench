    title: GT-identity 必跑
    detail: C1 B-MVE-1 必含 C1-GTIdentity 一等对照; GT-identity 打平 OT-dustbin 则 C1 降级
    status: active
    note: B 未启动 (RHINO 缺失)
  R2:
    title: B 死不迁 A
    detail: C1/B 触发停止条件后, cross-view/augmentation/consistency 目标不得迁入 A4
    status: active
  R3:
    title: A-gate-1 同宿主审计
    detail: A4 source sanity 必在 frozen hybrid-encoder oriented DETR 上跑, 不得用 RHINO/便利快照替代
    status: pending_host
    note: A4 host 未提供
  R4:
    title: Calibration / Audit split 分离
    detail: D_cal ∩ D_audit = ∅; 样本不足用 K-fold cross-fitting
    status: pending
    note: dry-run 未分 split; 正式实验前建立
  R5:
    title: 扰动族互斥
    detail: G_geom ∩ G_style = ∅ (几何/旋转/flip vs DOTA-C style/corruption)
    status: active
    note: probe 未运行
  R6:
    title: Host / Baseline 冻结
    detail: A4=hybrid-encoder oriented DETR; C1/B=RHINO-style rotated DETR; D2=9-detector taxonomy
    status: partial
    note: RHINO missing; A4 pending; 9-detector taxonomy 已定义
  R7:
    title: D2 独立性与 Bench-Core 基元统一
    detail: GV-obliquity/default score/buckets/valid masks/NRC-AUC/Risk@70/90 统一定义, A/B 只调用
    status: active
    note: 基元单源实现 (orientbench/metrics, buckets)
  R8:
    title: 跑前冻结闸门阈值
    detail: 所有通过/打平/降级/停止判据必须实验前冻结
    status: pending
    note: configs/thresholds.yaml freeze_status=pending; 全部输出 dry-run

missing_risks:
